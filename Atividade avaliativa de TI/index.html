<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

<div class="numero">
    <strong>03</strong>
    <span>notas para<br>uma média final</span>
</div>
</section>

<section class="painel">
<div class="painel-topo">
    <h2>Nova consulta</h2>
    <span>01 — 04</span>
</div>

<form id="formNotas">
    <label for="nome">NOME DO ESTUDANTE</label>
    <input type="text" id="nome" placeholder="Ex.: Ana Clara">

    <div class="notas">
        <div>
            <label for="nota1">NOTA 01</label>
            <input type="number" id="nota1" placeholder="00,0"
                min="0" max="10" step="any">
        </div>

        <div>
            <label for="nota2">NOTA 02</label>
            <input type="number" id="nota2" placeholder="00,0"
                min="0" max="10" step="any">
        </div>

        <div>
            <label for="nota3">NOTA 03</label>
            <input type="number" id="nota3" placeholder="00,0"
                min="0" max="10" step="any">
        </div>
    </div>

    <div class="acoes">
        <button type="submit">Calcular média ↗</button>
        <button type="button" id="limpar">Limpar ×</button>
    </div>
</form>

<div class="resultado-area">
    <span class="etiqueta">RESULTADO DA CONSULTA</span>
    <div id="resultado"></div>
    <p id="mensagemInicial">Os dados aparecerão aqui após o cálculo.</p>
</div>
</section>
</main>

<footer>
<span>NOTA! / 2026</span>
<span>EDUCAÇÃO · DESEMPENHO · RESULTADOS</span>
</footer>

<script src="script.js"></script>
</body>
</html>


<script src="script.js"></script>


</body>
</html>
